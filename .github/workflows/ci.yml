name: CPU validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.5
      - run: uv pip sync --system requirements-cpu-lock.txt
      - run: uv pip install --system --no-deps -e .
      - run: python scripts/verify.py
      - run: sh scripts/training/smoke.sh
      - run: codexa release fixture --corpus examples/corpus --output outputs/exports/ci-fixture
      - run: codexa release preflight --artifact outputs/exports/ci-fixture --verification-report outputs/logs/verification.json
      - run: uv build
      - run: uv pip install --system --no-deps --reinstall dist/*.whl
      - run: cd /tmp && codexa --help
      - run: cd /tmp && python -c "import codexa; assert 'site-packages' in codexa.__file__"
